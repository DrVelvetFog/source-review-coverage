# Every example in the README and the docs is executed in CI and attested, so a reader
# (or an agent) can check that an example still runs instead of recalling that it did.
name: verified-examples
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the verify-artifact fixture replays real history
      - run: git config --global user.email ci@ci && git config --global user.name ci
      - run: curl -fsSL https://raw.githubusercontent.com/DrVelvetFog/verified-examples/main/xv -o xv && chmod +x xv
      - run: ./xv check --rerun --strict
