# Dogfood: this repository runs its own action on every push to main and on
# every pull request. The signer is the workflow identity, never a developer
# (rule R4 of the specification).
name: attest

on:
  push:
    branches: [main]
  pull_request:
  pull_request_review:
    types: [submitted]   # re-run when a review lands, so approval state is attested
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # ambient OIDC — the whole point
  pull-requests: write # read reviews; post the one status comment
  checks: write        # the check run with inline residual annotations

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      # A local action reference needs the repository present first.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        with:
          checkout: "false"
          # Approvals are read from the pull request's reviews. A direct push to
          # main carries none and is correctly UNVERIFIED; a reviewed merge is
          # VERIFIED. The gate is the signature; residuals are reported, not
          # blocked, on this repository.
          fail-on: signature
          # This repository shows its own verdict on every pull request.
          comment: always
          check: always
