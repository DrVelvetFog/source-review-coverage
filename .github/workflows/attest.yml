# Dogfood: this repository runs its own action on every push to main and on
# every pull request. The signer is the workflow identity, never a developer
# (rule R4 of the specification).
name: attest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # ambient OIDC — the whole point
  pull-requests: read  # CE-002 will read approvals from here

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      # A local action reference needs the repository present first.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          checkout: "false"
          # Commits reach main by direct push, so there is no approval to bind
          # and the coverage verdict is correctly UNVERIFIED until CE-002 lands.
          # The gate here is the signature, which is what this run can prove.
          fail-on: signature
